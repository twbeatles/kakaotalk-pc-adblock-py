name: windows-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pyright
        shell: pwsh
        run: |
          $env:PYTHONPATH = "legacy/python-v11"
          python -m pyright

      - name: Pytest
        shell: pwsh
        run: |
          $env:PYTHONPATH = "legacy/python-v11"
          pytest -q --basetemp .pytest_tmp

  rust-core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release Build
        run: cargo build --release -p kakao-app

      - name: Copy Release Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          Copy-Item -Force .\target\release\kakao-adblock-rs.exe ..\dist\KakaoTalkLayoutAdBlocker_v11.exe

      - name: Packaged Self Check
        shell: pwsh
        run: ..\dist\KakaoTalkLayoutAdBlocker_v11.exe --self-check --json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KakaoTalkLayoutAdBlocker_v11
          path: dist/KakaoTalkLayoutAdBlocker_v11.exe
